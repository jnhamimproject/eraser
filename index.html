<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14181c">
<title>বাল্ক ইরেজার</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#14181c;--panel:#1e252b;--line:#2f3a42;--tx:#e8eef2;--mu:#8fa0ab;--ac:#3ddc97;--ac2:#0b3d2a;--wr:#ff6b5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Bengali","Hind Siliguri",sans-serif;overscroll-behavior:none}
[hidden]{display:none!important}
button,label.b{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:700}
button:disabled{opacity:.4}
#home,#fin{padding:max(18px,env(safe-area-inset-top)) 18px 24px;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:26px;margin:6px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:15px;margin:0;color:var(--mu);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.st{font-size:14px;color:var(--mu)}.st.ok{color:var(--ac)}
progress{width:100%;height:8px}
#ed{position:fixed;inset:0;display:flex;flex-direction:column;background:#0c0f12}
#top{display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;font-size:15px}
#top b{flex:1}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:repeating-conic-gradient(#171c21 0 25%,#1b2127 0 50%) 0 0/20px 20px}
#wrap{position:absolute;left:0;top:0;transform-origin:0 0}
#wrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:auto}
#msk{opacity:.55}
#fr{position:absolute;pointer-events:none;border:2px solid var(--ac);box-shadow:0 0 0 999px #000b;background:linear-gradient(#fff4,#fff4) 33.3% 0/1px 100% no-repeat,linear-gradient(#fff4,#fff4) 66.6% 0/1px 100% no-repeat,linear-gradient(#fff4,#fff4) 0 33.3%/100% 1px no-repeat,linear-gradient(#fff4,#fff4) 0 66.6%/100% 1px no-repeat}
input[type=number]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;width:100%}
.ps.on,.mdb.on,.wf.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
#bar{background:var(--panel);border-top:1px solid var(--line);padding:10px 12px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#bar .row button{padding:10px 6px;font-size:15px}
.sl{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu)}.sl input{flex:1;accent-color:var(--ac)}
#bt{white-space:pre-line;line-height:1.5}
#busy{position:absolute;inset:0;background:#000a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9;text-align:center;padding:20px}
.sp{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:r 0.8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#top b{flex:0 0 auto}
.ic{min-height:40px;padding:6px 12px}
#qs{flex:1;text-align:center;font-size:13px;color:var(--ac)}
#hint{position:absolute;left:8px;right:8px;top:8px;background:#000b;padding:8px 10px;border-radius:10px;font-size:13px;color:#cfd8de;pointer-events:none;z-index:3;text-align:center}
#mh{font-size:12px;color:var(--mu);text-align:center}
#gv{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#gh{padding:max(12px,env(safe-area-inset-top)) 14px 8px;display:flex;justify-content:space-between;align-items:center;font-size:18px}
#gg{flex:1;overflow:auto;padding:4px 12px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.cd{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;min-height:70px}
.cd canvas{width:100%;display:block}
.dlb{position:absolute;right:4px;top:4px;min-height:32px!important;padding:2px 10px!important;font-size:15px;background:#000d!important}
.bg{position:absolute;top:4px;left:4px;font-size:12px;background:#000c;padding:2px 7px;border-radius:6px}
#gb{background:var(--panel);border-top:1px solid var(--line);padding:10px 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#home{gap:10px}
h1{font-size:22px;margin:4px 0 2px}
#home .card{padding:10px 12px;gap:8px}
#home .card h2{font-size:13px;letter-spacing:.03em;text-transform:uppercase}
.sm{min-height:42px!important;padding:8px 10px!important;font-size:14px}
.row.c{align-items:center}.row.c>span.st{flex:2}.row.c>span.x{flex:0;color:var(--mu)}
#rot{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:8px;z-index:4}
#rot button{min-height:44px;padding:6px 14px;background:#000a}
</style>
</head>
<body>

<div id="home">
  <div><h1>Bulk Eraser</h1><div class="st">Remove unwanted objects from your photos <span id="off"></span></div></div>

  <div class="card">
    <h2>AI Model</h2>
    <div class="row c"><span id="mst" class="st">…</span>
      <label class="b sm">Select<input id="mf" type="file" accept=".onnx" hidden></label>
      <button id="mdl" class="sm">Download</button></div>
    <div id="ast" class="st"></div>
    <progress id="mpg" max="1" value="0" hidden></progress>
  </div>

  <div class="card">
    <h2>Output Size</h2>
    <div class="row"><button class="ps sm" data-w="1080" data-h="1080">1:1</button><button class="ps sm" data-w="900" data-h="1200">3:4</button><button class="ps sm" data-w="1080" data-h="1350">4:5</button><button class="ps sm" data-w="0" data-h="0">Original</button></div>
    <div class="row c"><input id="ow" type="number" min="0" placeholder="W"><span class="x">×</span><input id="oh" type="number" min="0" placeholder="H"></div>
  </div>

  <div class="card">
    <h2>Work Mode</h2>
    <div class="row"><button class="wf sm" data-d="0">Live</button><button class="wf sm" data-d="1">Batch</button></div>
    <div id="wfh" hidden></div>
  </div>

  <div class="card">
    <h2>Photos</h2>
    <div class="row c"><label class="b sm" style="flex:2">Select photos<input id="pf" type="file" accept="image/*" multiple hidden></label><span id="pst" class="st"></span></div>
  </div>

  <div class="card" id="fcard" hidden>
    <h2>Save Folder</h2>
    <button id="fold" class="sm">Choose folder</button><div id="fst2" class="st" hidden></div>
  </div>

  <button id="go" class="p" disabled>Start</button>
</div>

<div id="ed" hidden>
  <div id="top"><button id="pv" class="ic">◀</button><b id="cnt"></b><button id="nx" class="ic">▶</button><span id="qs"></span><button id="gr" class="ic">▦ সব ছবি</button></div>
  <div id="stage"><div id="wrap"><canvas id="img"></canvas><canvas id="msk"></canvas></div>
    <div id="fr" hidden></div>
    <div id="rot"><button id="rl">↺</button><button id="rr">↻</button></div>
    <div id="hint">আঙুলে দাগ দিন · দুই আঙুলে জুম/সরান · তারপর নিচে ✓ চাপুন</div>
    <div id="busy" hidden><div class="sp"></div><div id="bt">প্রসেস হচ্ছে…</div></div>
  </div>
  <div id="bar">
    <div class="row" id="md"><button class="mdb" data-m="fast">⚡ দ্রুত</button><button class="mdb" data-m="ai">🧠 AI (নিখুঁত)</button></div>
    <div id="mh"></div>
    <div class="sl">ব্রাশ <input id="bs" type="range" min="6" max="80" value="24"><span id="bv">24</span></div>
    <div class="row">
      <button id="un">↶ আনডু</button><button id="cl">✕ দাগ</button><button id="rv">⟲ ফিট</button><button id="rt">↺ আসল</button>
    </div>
    <div class="row"><button id="er">👁 এখনই দেখুন</button><button id="dn" class="p">✓ কাজে দিন ▶</button></div>
  </div>
</div>

<div id="gv" hidden>
  <div id="gh"><b>সব ছবি</b><span id="gq" class="st"></span></div>
  <div id="gg"></div>
  <div id="gb">
    <button id="st" class="p" hidden></button>
    <div id="sst" class="st">ছবিতে চাপ দিলে আবার এডিট করা যাবে।</div>
    <div class="row"><button id="gbk">◀ এডিটে ফিরুন</button><button id="sv" class="p">⬇ সব সেভ</button></div>
    <button id="rs">নতুন ব্যাচ</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.1/dist/ort.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('eraser-sw.js').then(async()=>{await navigator.serviceWorker.ready;
    if(!self.crossOriginIsolated&&!navigator.serviceWorker.controller&&!sessionStorage.getItem('coi')){sessionStorage.setItem('coi','1');location.reload()}}).catch(()=>{});
}
const $=id=>document.getElementById(id);
const MODEL_URL='https://huggingface.co/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx';
const MAXSIDE=5000;
let files=[],idx=0,results=[],sessP=null,hasModel=false,mode='ai';
let W=0,H=0,s=1,tx=0,ty=0,undo=[],OW=0,OH=0,fr={x:0,y:0,w:0,h:0},minS=1,crop=false,dirH=null,used=new Set();
const ic=$('img'),mc=$('msk'),ix=ic.getContext('2d',{willReadFrequently:true}),mx=mc.getContext('2d',{willReadFrequently:true});
const bk=document.createElement('canvas'),bx=bk.getContext('2d');

/* ---------- IndexedDB ---------- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('bulkeraser',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function dbGet(k){const d=await idb();return new Promise(r=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}
async function dbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}

/* ---------- Mode ---------- */
try{mode=localStorage.getItem('mode2')||'ai'}catch(e){}
function setMode(m){mode=m;try{localStorage.setItem('mode2',m)}catch(e){}
  document.querySelectorAll('.mdb').forEach(b=>b.classList.toggle('on',b.dataset.m===m));$('mh').textContent=m==='fast'?'ছোট দাগ/পিনের জন্য · প্রায় তাৎক্ষণিক':'নিখুঁত ফল · ব্যাকগ্রাউন্ডে চলে, আপনি পরের ছবিতে যান';preload()}
document.querySelectorAll('.mdb').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function preload(){if(mode==='ai'&&hasModel&&!sessP){$('ast').textContent='Loading engine…';
  getSess().then(()=>{$('ast').textContent='Engine ready'+(self.crossOriginIsolated?' · multi-thread':'')}).catch(()=>{$('ast').textContent=''})}}

/* ---------- Workflow ---------- */
try{defer=localStorage.getItem('wf')==='1'}catch(e){}
function setWf(d){defer=d;try{localStorage.setItem('wf',d?'1':'0')}catch(e){}
  document.querySelectorAll('.wf').forEach(b=>b.classList.toggle('on',(b.dataset.d==='1')===d));
  $('wfh').textContent=d?'প্রতিটা ছবিতে সাইজ ঠিক করে মার্ক দিন। শেষে "রিমুভ শুরু করুন" চাপলে সব একসাথে মোছা শুরু হবে।':'প্রতিটা ছবিতে মার্ক দিয়ে ✓ চাপলেই কাজ ব্যাকগ্রাউন্ডে শুরু হয়ে যাবে।'}
document.querySelectorAll('.wf').forEach(b=>b.onclick=()=>setWf(b.dataset.d==='1'));

/* ---------- Home ---------- */
function refresh(){$('go').disabled=!(hasModel&&files.length)}
async function checkModel(){
  try{const b=await dbGet('lama');hasModel=!!b;
    $('mst').textContent=hasModel?'Model ready · '+Math.round(b.byteLength/1048576)+' MB':'No model';
    $('mst').className='st'+(hasModel?' ok':'')}catch(e){$('mst').textContent='Storage error'}
  refresh();preload()}
$('mf').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  $('mst').textContent='Saving…';try{await dbSet('lama',await f.arrayBuffer());sessP=null}catch(x){alert('সেভ হয়নি: '+x.message)}checkModel()};
$('mdl').onclick=async()=>{
  const pg=$('mpg');pg.hidden=false;pg.value=0;$('mst').textContent='Downloading…';
  try{const r=await fetch(MODEL_URL);if(!r.ok)throw new Error('HTTP '+r.status);
    const tot=+r.headers.get('content-length')||0,rd=r.body.getReader(),ch=[];let got=0;
    for(;;){const{done,value}=await rd.read();if(done)break;ch.push(value);got+=value.length;
      if(tot){pg.value=got/tot;$('mst').textContent='Downloading '+Math.round(got/1048576)+' / '+Math.round(tot/1048576)+' MB'}}
    $('mst').textContent='Saving…';
    await dbSet('lama',await new Blob(ch).arrayBuffer());sessP=null
  }catch(e){alert('ডাউনলোড ব্যর্থ: '+e.message+'\nলিংক থেকে ফাইল নামিয়ে "ফাইল সিলেক্ট" দিন:\n'+MODEL_URL)}
  pg.hidden=true;checkModel()};
$('pf').onchange=e=>{files=[...e.target.files];$('pst').textContent=files.length?files.length+' photos':'';refresh()};
function setPs(){const w=+$('ow').value||0,h=+$('oh').value||0;document.querySelectorAll('.ps').forEach(b=>b.classList.toggle('on',+b.dataset.w===w&&+b.dataset.h===h))}
document.querySelectorAll('.ps').forEach(b=>b.onclick=()=>{$('ow').value=b.dataset.w;$('oh').value=b.dataset.h;setPs()});
$('ow').oninput=$('oh').oninput=setPs;
try{const z=JSON.parse(localStorage.getItem('sz')||'[1080,1080]');$('ow').value=z[0];$('oh').value=z[1]}catch(e){$('ow').value=$('oh').value=1080}setPs();
if(window.showDirectoryPicker){$('fcard').hidden=false;$('fold').onclick=async()=>{try{dirH=await showDirectoryPicker({mode:'readwrite'});$('fst2').hidden=false;$('fst2').textContent='Folder: '+dirH.name+' ✓';$('fst2').className='st ok'}catch(e){}}}
$('go').onclick=()=>{
  OW=Math.round(+$('ow').value)||0;OH=Math.round(+$('oh').value)||0;if(!OW||!OH)OW=OH=0;
  try{localStorage.setItem('sz',JSON.stringify([OW,OH]))}catch(e){}
  photos=files.map(mkPhoto);q.length=0;$('home').hidden=true;openPhoto(0)};

/* ---------- Image load / view ---------- */
const mt=t=>/png/i.test(t)?'image/png':/webp/i.test(t)?'image/webp':'image/jpeg';
const blobOf=(c,t)=>new Promise(r=>c.toBlob(r,mt(t),0.97));
const mkPhoto=f=>({file:f,blob:f,name:f.name,type:f.type,crop:null,jobs:0,state:'new',thumb:null,w:[]});
const waitP=p=>p.jobs?new Promise(r=>p.w.push(r)):Promise.resolve();
let defer=false,photos=[],cur=-1,ready=false,openTok=0,dirty=false,navBusy=false;
async function openPhoto(i){
  const tok=++openTok,p=photos[i];cur=i;ready=false;
  $('gv').hidden=true;$('ed').hidden=false;$('cnt').textContent=(i+1)+' / '+photos.length;
  busy(p.jobs?'এই ছবির মোছার কাজ চলছে…\nশেষ হলে নিজে খুলবে। এর মধ্যে ◀ ▶ বা ▦ দিয়ে অন্য ছবিতে যেতে পারেন':'ছবি লোড হচ্ছে…');
  await waitP(p);if(tok!==openTok)return;
  try{
    const bmp=await createImageBitmap(p.blob,{imageOrientation:'from-image'});
    if(tok!==openTok)return;
    const k=Math.min(1,MAXSIDE/Math.max(bmp.width,bmp.height));W=Math.round(bmp.width*k);H=Math.round(bmp.height*k);
    ic.width=mc.width=bk.width=W;ic.height=mc.height=bk.height=H;
    ix.drawImage(bmp,0,0,W,H);bmp.close&&bmp.close();
    mx.clearRect(0,0,W,H);undo=[];dirty=false;cur=i;
    resetView();
    if(crop&&p.crop){s=fr.w/(p.crop.w*W);tx=fr.x-p.crop.x*W*s;ty=fr.y-p.crop.y*H*s;apply()}
    if(p.mask)mx.drawImage(p.mask,0,0,W,H);
    $('dn').textContent=defer?(i===photos.length-1?'✓ শেষ ছবি — রিমুভ শুরুর পাতায় ▶':'✓ মার্ক সেভ, পরের ছবি ▶'):'✓ কাজে দিন ▶';
    ready=true;
  }catch(e){alert('ছবি খোলা যায়নি: '+p.name)}
  busy(0)}
async function commit(){
  if(cur<0||!ready)return;const p=photos[cur];
  if(crop)p.crop={x:(fr.x-tx)/s/W,y:(fr.y-ty)/s/H,w:fr.w/s/W,h:fr.h/s/H};
  if(dirty){p.blob=await blobOf(ic,p.type);p.state='done';p.thumb=null;dirty=false}
  const comps=buildComps(ic,mc,W,H);
  if(defer){
    if(comps.length){const k=Math.min(1,1600/Math.max(W,H)),c=mk(Math.max(1,Math.round(W*k)),Math.max(1,Math.round(H*k)));
      c.getContext('2d').drawImage(mc,0,0,c.width,c.height);p.mask=c}
    else p.mask=null;
  }else if(comps.length){mx.clearRect(0,0,W,H);enqueue(p,comps,W,H)}
  p.thumb=null}
async function nav(i){
  if(navBusy)return;navBusy=true;
  try{await commit();ready=false}finally{navBusy=false}
  if(i<0)return;
  if(i>=photos.length)showGrid();else openPhoto(i)}
$('pv').onclick=()=>cur>0&&nav(cur-1);
$('nx').onclick=$('dn').onclick=()=>nav(cur+1);
$('gr').onclick=()=>nav(photos.length);
$('rt').onclick=async()=>{if(!ready||!confirm('এই ছবির সব এডিট বাদ দিয়ে আসল ছবি ফিরিয়ে আনবেন?'))return;
  const p=photos[cur];p.blob=p.file;p.state='new';p.thumb=null;p.crop=null;p.mask=null;await openPhoto(cur)};
function resetView(){
  const st=$('stage'),sw=st.clientWidth,sh=st.clientHeight,m=14;
  crop=OW>0&&OH>0;const ar=crop?OW/OH:W/H;
  let fw=sw-2*m,fh=fw/ar;if(fh>sh-2*m){fh=sh-2*m;fw=fh*ar}
  fr={x:(sw-fw)/2,y:(sh-fh)/2,w:fw,h:fh};
  minS=crop?Math.max(fw/W,fh/H):fw/W;
  s=minS;tx=fr.x-(W*s-fw)/2;ty=fr.y-(H*s-fh)/2;
  const w=$('wrap');w.style.width=W+'px';w.style.height=H+'px';
  const f=$('fr');f.hidden=!crop;Object.assign(f.style,{left:fr.x+'px',top:fr.y+'px',width:fw+'px',height:fh+'px'});
  apply()}
function apply(){
  tx=Math.min(fr.x,Math.max(fr.x+fr.w-W*s,tx));ty=Math.min(fr.y,Math.max(fr.y+fr.h-H*s,ty));
  $('wrap').style.transform=`translate(${tx}px,${ty}px) scale(${s})`}
$('rv').onclick=()=>{if(W)resetView()};
function busy(t){const b=$('busy');b.hidden=!t;if(t)$('bt').textContent=t}
addEventListener('resize',()=>{if(!$('ed').hidden&&W)resetView()});

/* ---------- Touch: 1 finger paint, 2 fingers pan/zoom ---------- */
const ptr=new Map();let paint=false,last=null,g=null;
const stage=$('stage');
function pos(e){const r=mc.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H,k:W/r.width}}
function dot(p,q){const r=+$('bs').value*p.k;mx.strokeStyle=mx.fillStyle='#ff2d2d';mx.lineWidth=r;mx.lineCap=mx.lineJoin='round';
  mx.beginPath();if(q){mx.moveTo(q.x,q.y);mx.lineTo(p.x,p.y);mx.stroke()}else{mx.arc(p.x,p.y,r/2,0,7);mx.fill()}}

  if(ptr.size===1){bx.clearRect(0,0,W,H);bx.drawImage(mc,0,0);paint=true;last=pos(e);dot(last)}

    const[a,b]=[...ptr.values()],r=stage.getBoundingClientRect();
    g={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),mx:(a.clientX+b.clientX)/2-r.left,my:(a.clientY+b.clientY)/2-r.top,s,tx,ty}}

    const ns=Math.min(minS*14,Math.max(minS,g.s*d/g.d));
    tx=m.x-(g.mx-g.tx)/g.s*ns;ty=m.y-(g.my-g.ty)/g.s*ns;s=ns;apply()}
});

/* ---------- LaMa / fast inpaint ---------- */
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
let fixedN=false;
function getSess(){
  if(!sessP){sessP=(async()=>{
    const buf=await dbGet('lama');if(!buf)throw new Error('মডেল নেই');
    ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.1/dist/';
    const th=self.crossOriginIsolated?Math.min(4,navigator.hardwareConcurrency||2):1;
    const cf=[[th,true],[th,false]];if(th>1)cf.push([1,false]);let err;
    for(const[n,px]of cf){try{ort.env.wasm.numThreads=n;ort.env.wasm.proxy=px;
      return await ort.InferenceSession.create(new Uint8Array(buf),{executionProviders:['wasm'],graphOptimizationLevel:'basic'})}catch(e){err=e}}
    throw err
  })();sessP.catch(()=>{sessP=null})}
  return sessP}
function fastFill(c,w,h,hole){
  const N=w*h;let cc=new Float32Array(N*3),aa=new Float32Array(N);
  for(let i=0;i<N;i++)if(!hole[i]){cc[i*3]=c[i*3];cc[i*3+1]=c[i*3+1];cc[i*3+2]=c[i*3+2];aa[i]=1}
  let cw=w,ch=h;const L=[[cc,aa,cw,ch]];
  while(cw>1||ch>1){const nw=(cw+1)>>1,nh=(ch+1)>>1,nc=new Float32Array(nw*nh*3),na=new Float32Array(nw*nh);
    for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){const i=y*cw+x,j=(y>>1)*nw+(x>>1);na[j]+=aa[i];nc[j*3]+=cc[i*3];nc[j*3+1]+=cc[i*3+1];nc[j*3+2]+=cc[i*3+2]}
    cc=nc;aa=na;cw=nw;ch=nh;L.push([cc,aa,cw,ch])}
  for(let k=L.length-2;k>=0;k--){const[fc,fa,fw,fh]=L[k],[pc,pa,pw]=L[k+1];
    for(let y=0;y<fh;y++)for(let x=0;x<fw;x++){const i=y*fw+x;if(fa[i]===0){const j=(y>>1)*pw+(x>>1),d=pa[j]||1;
      fc[i*3]=pc[j*3]/d;fc[i*3+1]=pc[j*3+1]/d;fc[i*3+2]=pc[j*3+2]/d;fa[i]=1}}}
  const o=L[0][0];
  for(let it=0;it<40;it++)for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(!hole[i])continue;
    const l=x>0?i-1:i,r=x<w-1?i+1:i,u=y>0?i-w:i,d=y<h-1?i+w:i;
    for(let k=0;k<3;k++)o[i*3+k]=(o[l*3+k]+o[r*3+k]+o[u*3+k]+o[d*3+k])/4}
  return o}


function buildComps(ic,mc,W,H){
  const g=8,gw=Math.ceil(W/g),gh=Math.ceil(H/g),n=gw*gh,sm=mk(gw,gh),sc=sm.getContext('2d',{willReadFrequently:true});
  sc.drawImage(mc,0,0,gw,gh);const da=sc.getImageData(0,0,gw,gh).data,m=new Uint8Array(n);let any=0;
  for(let i=0;i<n;i++)if(da[i*4+3]>6){m[i]=1;any=1}
  if(!any)return[];
  const dd=new Uint8Array(n),R=3,lab=new Uint8Array(n),out=[],fast=mode==='fast';
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++)if(m[y*gw+x])for(let v=-R;v<=R;v++)for(let u=-R;u<=R;u++){const yy=y+v,xx=x+u;if(yy>=0&&yy<gh&&xx>=0&&xx<gw)dd[yy*gw+xx]=1}
  for(let s0=0;s0<n;s0++){
    if(!dd[s0]||lab[s0])continue;
    const st=[s0];let x0=gw,y0=gh,x1=-1,y1=-1;lab[s0]=1;
    while(st.length){const i=st.pop(),x=i%gw,y=(i/gw)|0;
      if(m[i]){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
      if(x>0&&dd[i-1]&&!lab[i-1]){lab[i-1]=1;st.push(i-1)}
      if(x<gw-1&&dd[i+1]&&!lab[i+1]){lab[i+1]=1;st.push(i+1)}
      if(y>0&&dd[i-gw]&&!lab[i-gw]){lab[i-gw]=1;st.push(i-gw)}
      if(y<gh-1&&dd[i+gw]&&!lab[i+gw]){lab[i+gw]=1;st.push(i+gw)}}
    if(x1<0)continue;
    const bx0=x0*g,by0=y0*g,bw=(x1+1)*g-bx0,bh=(y1+1)*g-by0,mxs=Math.max(bw,bh),cx=bx0+bw/2,cy=by0+bh/2;
    let N=512,side;
    if(fast)side=Math.max(96,mxs*3);
    else if(!fixedN&&mxs*1.8<=300){N=256;side=Math.max(256,mxs*1.8)}
    else side=Math.max(512,mxs*1.8);
    side=Math.min(Math.round(side),Math.min(W,H));
    const sx=Math.round(Math.min(Math.max(0,cx-side/2),W-side)),sy=Math.round(Math.min(Math.max(0,cy-side/2),H-side));
    const cropC=mk(side,side);cropC.getContext('2d').drawImage(ic,sx,sy,side,side,0,0,side,side);
    const em=mk(side,side);em.getContext('2d').drawImage(mc,sx,sy,side,side,0,0,side,side);
    const dm=mk(side,side),dx=dm.getContext('2d'),r=Math.max(2,Math.round(side/(fast?100:200)));
    for(let u=-1;u<=1;u++)for(let v=-1;v<=1;v++)dx.drawImage(em,u*r,v*r);
    out.push({side,sx,sy,N,cropC,dm,mode})}
  return out}

async function runAI(c,N){
  const ci=mk(N,N),cx2=ci.getContext('2d',{willReadFrequently:true});cx2.imageSmoothingQuality='high';cx2.drawImage(c.cropC,0,0,N,N);
  const cm=mk(N,N),cmx=cm.getContext('2d',{willReadFrequently:true});cmx.drawImage(c.dm,0,0,N,N);
  const id=cx2.getImageData(0,0,N,N).data,md=cmx.getImageData(0,0,N,N).data,P=N*N;
  const fi=new Float32Array(3*P),fm=new Float32Array(P);
  for(let i=0;i<P;i++){fi[i]=id[i*4]/255;fi[P+i]=id[i*4+1]/255;fi[2*P+i]=id[i*4+2]/255;fm[i]=md[i*4+3]>30?1:0}
  const se=await getSess(),nm=se.inputNames;
  const iN=nm.find(n=>/img|image/i.test(n))||nm[0],mN=nm.find(n=>/mask/i.test(n))||nm[1];
  const out=await se.run({[iN]:new ort.Tensor('float32',fi,[1,3,N,N]),[mN]:new ort.Tensor('float32',fm,[1,1,N,N])});
  const o=out[se.outputNames[0]].data;
  let mxv=0;for(let i=0;i<P;i+=97)mxv=Math.max(mxv,o[i],o[P+i],o[2*P+i]);
  const sc=mxv<=2?255:1,oc=mk(N,N),ox=oc.getContext('2d'),od=ox.createImageData(N,N);
  for(let i=0;i<P;i++){od.data[i*4]=o[i]*sc;od.data[i*4+1]=o[P+i]*sc;od.data[i*4+2]=o[2*P+i]*sc;od.data[i*4+3]=255}
  ox.putImageData(od,0,0);return oc}

async function runComp(c){
  const side=c.side;let t;
  if(c.mode==='fast'){
    const id2=c.cropC.getContext('2d').getImageData(0,0,side,side),px=id2.data,md=c.dm.getContext('2d').getImageData(0,0,side,side).data,n=side*side,hole=new Uint8Array(n),f=new Float32Array(n*3);
    for(let i=0;i<n;i++){hole[i]=md[i*4+3]>30?1:0;f[i*3]=px[i*4];f[i*3+1]=px[i*4+1];f[i*3+2]=px[i*4+2]}
    const o=fastFill(f,side,side,hole);
    for(let i=0;i<n;i++)if(hole[i]){px[i*4]=o[i*3];px[i*4+1]=o[i*3+1];px[i*4+2]=o[i*3+2]}
    t=mk(side,side);t.getContext('2d').putImageData(id2,0,0);
  }else{
    let o;try{o=await runAI(c,c.N)}catch(e){if(c.N===256){fixedN=true;o=await runAI(c,512)}else throw e}
    t=mk(side,side);const tc=t.getContext('2d');tc.imageSmoothingQuality='high';tc.drawImage(o,0,0,side,side)}
  const bm=mk(side,side),b2=bm.getContext('2d');b2.filter='blur('+Math.max(1,side/400)+'px)';b2.drawImage(c.dm,0,0);
  const t2=t.getContext('2d');t2.globalCompositeOperation='destination-in';t2.drawImage(bm,0,0);return t}

/* ---------- Background queue ---------- */
const q=[];let running=false;
function upd(){const n=q.length+(running?1:0),t=n?'⏳ '+n+' কাজ চলছে':'';$('qs').textContent=t;$('gq').textContent=t||'✓ সব কাজ শেষ';if(!$('gv').hidden)render()}
function enqueue(p,comps,W0,H0){p.jobs++;p.err=null;q.push({p,comps,W0,H0});upd();pump()}
async function pump(){
  if(running)return;running=true;
  while(q.length){const j=q.shift();
    try{await runJob(j);j.p.state='done'}catch(e){j.p.err=e.message||'ত্রুটি';console.error(e)}
    j.p.jobs--;j.p.thumb=null;if(!j.p.jobs){j.p.w.forEach(r=>r());j.p.w=[]}upd()}
  running=false;upd()}
async function runJob({p,comps,W0,H0}){
  const ts=[];for(const c of comps)ts.push([c,await runComp(c)]);
  const bmp=await createImageBitmap(p.blob,{imageOrientation:'from-image'});
  const cv=mk(W0,H0),x=cv.getContext('2d');x.drawImage(bmp,0,0,W0,H0);bmp.close&&bmp.close();
  for(const[c,t]of ts)x.drawImage(t,c.sx,c.sy);
  p.blob=await blobOf(cv,p.type)}

/* ---------- Grid / review ---------- */
function cropFor(p,w,h){
  if(!(OW&&OH))return[0,0,w,h];
  if(p.crop)return[p.crop.x*w,p.crop.y*h,p.crop.w*w,p.crop.h*h];
  const ar=OW/OH;let cw=w,ch=h;if(w/h>ar)cw=h*ar;else ch=w/ar;return[(w-cw)/2,(h-ch)/2,cw,ch]}
async function mkThumb(p){
  const bmp=await createImageBitmap(p.blob,{imageOrientation:'from-image'});
  const[x,y,w,h]=cropFor(p,bmp.width,bmp.height),k=220/Math.max(w,h),c=mk(Math.max(1,Math.round(w*k)),Math.max(1,Math.round(h*k)));
  c.getContext('2d').drawImage(bmp,x,y,w,h,0,0,c.width,c.height);bmp.close&&bmp.close();return c}

function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function renderFinal(p){
  if(!(OW&&OH)&&p.blob===p.file)return p.file;
  const bmp=await createImageBitmap(p.blob,{imageOrientation:'from-image'});
  const[x,y,w,h]=cropFor(p,bmp.width,bmp.height),ow=OW||bmp.width,oh=OH||bmp.height,c=mk(ow,oh),cx=c.getContext('2d');
  cx.imageSmoothingQuality='high';cx.drawImage(bmp,x,y,w,h,0,0,ow,oh);bmp.close&&bmp.close();return blobOf(c,p.type)}
function outName(p,used){
  let n=p.name;const t=mt(p.type),ext=t==='image/png'?'png':t==='image/webp'?'webp':'jpg';
  if(!(t==='image/jpeg'?/\.jpe?g$/i.test(n):p.type===t))n=n.replace(/\.[^.]+$/,'')+'.'+ext;
  if(used.has(n.toLowerCase())){const m=n.match(/^(.*)(\.[^.]+)$/);let k=2,nn;do{nn=m[1]+' ('+k+++')'+m[2]}while(used.has(nn.toLowerCase()));n=nn}
  used.add(n.toLowerCase());return n}

async function fromCam(){
  if(location.hash!=='#cam')return;
  let sel;try{sel=JSON.parse(localStorage.getItem('toEraser'))}catch(e){}
  if(!sel||!sel.ids)return;
  try{
    const d=await new Promise((res,rej)=>{const r=indexedDB.open('camtool');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
    const rq=(st,k)=>new Promise(r=>{const q=d.transaction(st).objectStore(st).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()});
    const fl=[];for(const id of sel.ids){const f=await rq('f',id),b=await rq('b',id);if(f&&b)fl.push(new File([b.blob],f.name,{type:b.blob.type||'image/jpeg'}))}
    d.close();files=fl;$('pst').textContent=fl.length+' photos (Camera)';refresh();
  }catch(e){}
  try{localStorage.removeItem('toEraser')}catch(e){}history.replaceState(null,'',location.pathname)}
async function offChk(){try{let shell=false,wasm=false;for(const k of await caches.keys()){const c=await caches.open(k);
  if(await c.match(new URL('./index.html',location.href).href))shell=true;
  if((await c.keys()).some(r=>/ort-wasm/.test(r.url)))wasm=true}
  $('off').textContent=shell?(wasm?'· Offline ✓':'· Offline: run AI once online'):''}catch(e){}}
setWf(defer);setMode(mode);checkModel();fromCam();offChk();
</script>
